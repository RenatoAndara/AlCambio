# Compila el APK de la Calculadora BCV en los servidores de GitHub
# Autor: Renato Andara
name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk CalculadoraBCV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CalculadoraBCV-apk
          path: CalculadoraBCV.apk
